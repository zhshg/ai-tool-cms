upstream web {
    server web:3000;
}

upstream admin {
    server admin:3000;
}

upstream api {
    server api:4000;
}

server {
    listen 80;
    server_name toolsdar.io www.toolsdar.io admins.toolsdar.io api.toolsdar.io img.toolsdar.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.toolsdar.io;

    ssl_certificate /etc/letsencrypt/live/toolsdar.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toolsdar.io/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://toolsdar.io$request_uri;
}

server {
    listen 443 ssl http2;
    server_name img.toolsdar.io;

    ssl_certificate /etc/letsencrypt/live/toolsdar.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toolsdar.io/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50m;
    root /var/www/storage;

    location ^~ /logos/ {
        access_log off;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri =404;
    }

    location ^~ /screenshots/ {
        access_log off;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri =404;
    }

    location ^~ /brand/ {
        access_log off;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location / {
        access_log off;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl http2;
    server_name api.toolsdar.io;
    resolver 127.0.0.11 ipv6=off valid=10s;

    ssl_certificate /etc/letsencrypt/live/toolsdar.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toolsdar.io/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50m;

    location / {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name admins.toolsdar.io;
    resolver 127.0.0.11 ipv6=off valid=10s;

    ssl_certificate /etc/letsencrypt/live/toolsdar.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toolsdar.io/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50m;

    location /v1 {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        return 302 /admin;
    }

    location = /admin {
        proxy_pass http://admin/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin/ {
        proxy_pass http://admin/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /admin/ {
        proxy_pass http://admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name toolsdar.io;
    resolver 127.0.0.11 ipv6=off valid=10s;

    ssl_certificate /etc/letsencrypt/live/toolsdar.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toolsdar.io/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50m;

    location ^~ /logos/ {
        alias /var/www/storage/logos/;
        access_log off;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri =404;
    }

    location ^~ /screenshots/ {
        alias /var/www/storage/screenshots/;
        access_log off;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri =404;
    }

    location ^~ /brand/ {
        alias /var/www/storage/public/brand/;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
